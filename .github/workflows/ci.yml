name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests
        run: |
          # -rf liste les tests en échec à la fin
          # on les remonte en annotations rouges, visibles en haut de la page du run sans ouvrir les logs
          pytest -q -rf | tee pytest.log
          status=${PIPESTATUS[0]}
          grep "^FAILED" pytest.log | while read -r line; do echo "::error::$line"; done
          exit $status
